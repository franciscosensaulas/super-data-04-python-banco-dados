<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="860" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C6C2B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="840" fill="#FAF9F7"/>

  <text x="80" y="50" font-size="23" font-weight="700" fill="#1F1E1C">Fluxo de instalação com pip</text>
  <text x="80" y="73" font-size="14" fill="#6B6862">do &quot;preciso de uma biblioteca&quot; até o colega rodar o projeto</text>

  <!-- conectores -->
  <line x1="112" y1="288" x2="112" y2="306" stroke="#C6C2B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="112" y1="412" x2="112" y2="430" stroke="#C6C2B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="112" y1="536" x2="112" y2="554" stroke="#C6C2B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="112" y1="660" x2="112" y2="678" stroke="#C6C2B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="112" y1="784" x2="112" y2="802" stroke="#C6C2B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 -->
  <rect x="80" y="110" width="700" height="84" rx="12" fill="#FFFFFF" stroke="#E3E1DC"/>
  <circle cx="112" cy="152" r="19" fill="#C15F3C"/>
  <text x="112" y="158" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="152" y="144" font-size="17" font-weight="600" fill="#1F1E1C">Preciso de uma funcionalidade</text>
  <text x="152" y="170" font-size="14" fill="#6B6862">Ex.: imprimir tabelas bonitas no terminal</text>

  <!-- 2 -->
  <rect x="80" y="234" width="700" height="84" rx="12" fill="#FFFFFF" stroke="#E3E1DC"/>
  <circle cx="112" cy="276" r="19" fill="#C15F3C"/>
  <text x="112" y="282" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="152" y="268" font-size="17" font-weight="600" fill="#1F1E1C">Procuro a biblioteca no PyPI</text>
  <text x="152" y="294" font-size="14" fill="#6B6862">pypi.org — confirmo o nome exato e a versão: rich</text>

  <!-- 3 -->
  <rect x="80" y="358" width="700" height="84" rx="12" fill="#FFFFFF" stroke="#E3E1DC"/>
  <circle cx="112" cy="400" r="19" fill="#C15F3C"/>
  <text x="112" y="406" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="152" y="388" font-size="17" font-weight="600" fill="#1F1E1C">Instalo com o pip</text>
  <rect x="152" y="400" width="216" height="26" rx="6" fill="#F1EEE8" stroke="#E3DFD5"/>
  <text x="163" y="418" font-size="14" font-family="Consolas, Menlo, monospace" fill="#8A4226">pip install rich==15.0.0</text>
  <text x="384" y="418" font-size="13" fill="#8C8880">o pip baixa o pacote e as dependências dele</text>

  <!-- 4 -->
  <rect x="80" y="482" width="700" height="84" rx="12" fill="#FFFFFF" stroke="#E3E1DC"/>
  <circle cx="112" cy="524" r="19" fill="#C15F3C"/>
  <text x="112" y="530" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="152" y="512" font-size="17" font-weight="600" fill="#1F1E1C">Uso no meu código</text>
  <rect x="152" y="524" width="200" height="26" rx="6" fill="#F1EEE8" stroke="#E3DFD5"/>
  <text x="163" y="542" font-size="14" font-family="Consolas, Menlo, monospace" fill="#8A4226">from rich import print</text>

  <!-- 5 -->
  <rect x="80" y="606" width="700" height="84" rx="12" fill="#FFFFFF" stroke="#E3E1DC"/>
  <circle cx="112" cy="648" r="19" fill="#C15F3C"/>
  <text x="112" y="654" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="152" y="636" font-size="17" font-weight="600" fill="#1F1E1C">Registro no requirements.txt</text>
  <rect x="152" y="648" width="116" height="26" rx="6" fill="#F1EEE8" stroke="#E3DFD5"/>
  <text x="163" y="666" font-size="14" font-family="Consolas, Menlo, monospace" fill="#8A4226">rich==15.0.0</text>
  <text x="284" y="666" font-size="13" fill="#8C8880">sem esta linha, o projeto quebra na máquina do colega</text>

  <!-- 6 -->
  <rect x="80" y="730" width="700" height="84" rx="12" fill="#F3F8F4" stroke="#CFE3D6"/>
  <circle cx="112" cy="772" r="19" fill="#2E7D55"/>
  <text x="112" y="778" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="152" y="760" font-size="17" font-weight="600" fill="#1F1E1C">Outra pessoa roda o projeto</text>
  <rect x="152" y="772" width="272" height="26" rx="6" fill="#E6F0E9" stroke="#CFE3D6"/>
  <text x="163" y="790" font-size="14" font-family="Consolas, Menlo, monospace" fill="#22603F">pip install -r requirements.txt</text>
  <text x="440" y="790" font-size="13" fill="#7F998A">um comando só instala tudo</text>
</svg>
